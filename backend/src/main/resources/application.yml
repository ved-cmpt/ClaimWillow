spring:
  application:
    name: claimwillow
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/claimwillow}
    username: ${SPRING_DATASOURCE_USERNAME:claimwillow}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    time-zone: UTC

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        name: CLAIMWILLOW_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  seed-demo-data: ${APP_SEED_DEMO_DATA:false}
  seed-demo-password: ${APP_SEED_DEMO_PASSWORD:}
  # Only local evaluation may use the password documented in the README.
  seed-demo-allow-documented-password: ${APP_SEED_DEMO_ALLOW_DOCUMENTED_PASSWORD:false}
  attachments:
    # local (private directory), database (attachment_blobs table) or azure (placeholder)
    storage-mode: ${ATTACHMENT_STORAGE_MODE:local}
    local-dir: ${ATTACHMENT_LOCAL_DIR:./data/attachments}
    max-size-bytes: 5242880
    max-per-claim: 10
  rules:
    duplicate-window-days: 7
    duplicate-amount-tolerance: 0.20
    min-description-length: 60

logging:
  pattern:
    correlation: "[%X{requestId:-}] "
