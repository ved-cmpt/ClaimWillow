name: CI

# Every pull request and every push to main runs this workflow, so the single required check
# "ci-ok" always reports. Which jobs actually run depends on the changed files (see "changes"):
#   - documentation only (**/*.md, docs/**, LICENSE): every job is skipped, ci-ok passes;
#   - any other change: backend verify and frontend lint/test/build run;
#   - backend/, frontend/, e2e/, Dockerfile or this workflow: the browser suite and image build run too.
# Workflow-level paths-ignore is not used on purpose: a workflow that never starts leaves a
# required check pending forever.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; else base="$PUSH_BEFORE"; fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No comparable base commit; running every job."
            { echo "code=true"; echo "app=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$base" HEAD)"
          echo "Changed files:"; echo "$files"
          code=false; app=false
          if echo "$files" | grep -qvE '(\.md$|^docs/|^LICENSE$)'; then code=true; fi
          if echo "$files" | grep -qE '^(backend/|frontend/|e2e/|Dockerfile$|\.dockerignore$|\.github/workflows/ci\.yml$)'; then
            app=true
          fi
          echo "code=$code app=$app"
          { echo "code=$code"; echo "app=$app"; } >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (unit + integration)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify (unit + Testcontainers integration tests)
        working-directory: backend
        run: ./mvnw -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint + test + build)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build

  e2e:
    name: Browser acceptance tests (Cucumber + Selenium)
    # Runs in parallel with the quick jobs; ci-ok still requires all of them.
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Package backend
        working-directory: backend
        run: ./mvnw -B -DskipTests package
      - name: Run scenarios against a disposable app + PostgreSQL (Testcontainers)
        working-directory: e2e
        run: ./mvnw -B test
      - name: Upload Cucumber report, screenshots and app log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            e2e/target/cucumber-report.html
            e2e/target/cucumber-junit.xml
            e2e/target/screenshots
            e2e/target/e2e-backend.log
          if-no-files-found: ignore

  docker:
    name: Production image build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image (frontend + backend, multi-stage)
        run: docker build --tag claimwillow:ci .
      - name: Smoke test the image against a throwaway database
        run: |
          docker network create cw-ci
          docker run -d --name cw-db --network cw-ci -e POSTGRES_DB=claimwillow -e POSTGRES_USER=claimwillow \
            -e POSTGRES_PASSWORD=ci_only_password postgres:16-alpine
          for i in $(seq 1 30); do docker exec cw-db pg_isready -U claimwillow -d claimwillow && break; sleep 2; done
          # Same memory limit and storage mode as the free hosting target (512 MB, evidence in PostgreSQL).
          docker run -d --name cw-app --network cw-ci -p 8080:8080 --memory=512m \
            -e ATTACHMENT_STORAGE_MODE=database \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://cw-db:5432/claimwillow \
            -e SPRING_DATASOURCE_USERNAME=claimwillow -e SPRING_DATASOURCE_PASSWORD=ci_only_password \
            -e SESSION_COOKIE_SECURE=false claimwillow:ci
          for i in $(seq 1 60); do curl -fs http://localhost:8080/actuator/health && break; sleep 2; done
          curl -fs http://localhost:8080/actuator/health | grep -q UP
          curl -fs http://localhost:8080/login | grep -q 'id="root"'
          curl -fs http://localhost:8080/actuator/health/readiness | grep -q UP
          docker stats --no-stream --format 'memory: {{.MemUsage}}' cw-app
      - name: Container logs
        if: always()
        run: docker logs cw-app || true

  ci-ok:
    # The only check branch protection requires. Passes when every job either succeeded or was
    # skipped because its files did not change; fails on any failure or cancellation.
    name: ci-ok
    if: always()
    needs: [changes, backend, frontend, e2e, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "A CI job ended with: $r"; exit 1 ;;
            esac
          done
