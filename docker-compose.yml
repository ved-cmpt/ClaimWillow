# ClaimWillow local stack.
#   Database only (for local development):  docker compose -p claimwillow up -d db
#   Integrated app (production image):      docker compose -p claimwillow up --build
# Credentials below are development-only defaults for a local machine; never reuse them anywhere else.
name: claimwillow

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: claimwillow
      POSTGRES_USER: claimwillow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claimwillow_dev}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - claimwillow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimwillow -d claimwillow"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: claimwillow:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/claimwillow
      SPRING_DATASOURCE_USERNAME: claimwillow
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-claimwillow_dev}
      # Plain HTTP on localhost; must be true behind HTTPS.
      SESSION_COOKIE_SECURE: "false"
      # Synthetic demo accounts for local evaluation only.
      APP_SEED_DEMO_DATA: ${APP_SEED_DEMO_DATA:-true}
      APP_SEED_DEMO_PASSWORD: ${APP_SEED_DEMO_PASSWORD:-demo1234}
      ATTACHMENT_STORAGE_MODE: local
      ATTACHMENT_LOCAL_DIR: /app/data/attachments
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - claimwillow-attachments:/app/data/attachments

volumes:
  claimwillow-db:
  claimwillow-attachments:
